<header style="background: #004080; color: white; padding: 10px 0; text-align: center; position: relative;">
  <!-- Botão logout (só aparece se usuário estiver logado) -->
  {% if usuario %}
  <div class="logout" style="position:absolute;top:10px;right:20px;z-index:10;">
    <form action="/api/session/logout" method="post">
      <button type="submit" style="background-color: #004080; color: #fff; border: 2px solid #fff; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s;">Sair</button>
    </form>
  </div>
  {% endif %}
    <!-- Logo sempre presente -->
  <div style="display: flex; align-items: center; justify-content: center; max-width: 1200px; margin: 0 auto;">
    <img src="/static/images/fad_logo_banco_completo1.png?v=1.0"
         alt="FAD - Ferramenta de Análise Dinamizada"
         style="height: 150px; cursor: pointer;"
         onclick="window.location.href='/'">
  </div>
</header>

<!-- Timer de sessão avançado (só para páginas autenticadas) -->
{% if usuario %}
<div id="session-status" style="background:#e3f2fd;color:#003366;padding:10px 0;text-align:center;font-size:16px;font-weight:bold;letter-spacing:0.5px;border-bottom:2px solid #003366;">
  🔒 Usuário: {{ usuario.nome }} | 
  ⏱️ Sessão: <span id="session-timer" style="color:#d32f2f;font-weight:bold;">--:--</span>
  <button id="renew-session-btn" style="margin-left:15px;background:#4caf50;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;" title="Renovar sessão manualmente">🔄 Renovar</button>
</div>

<script src="/static/js/session_control.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var tempoRestante = Number('{{ tempo_restante|default(0) }}');
  var timerEl = document.getElementById('session-timer');
  
  if (tempoRestante > 0 && timerEl) {
    function atualizarTimer() {
      if (tempoRestante <= 0) {
        timerEl.textContent = '00:00';
        alert('Sessão expirou!');
        window.location.href = '/login';
        return;
      }
      
      var minutos = Math.floor(tempoRestante / 60);
      var segundos = tempoRestante % 60;
      var display = String(minutos).padStart(2, '0') + ':' + String(segundos).padStart(2, '0');
      
      timerEl.textContent = display;
      tempoRestante--;
    }
    
    atualizarTimer();
    setInterval(atualizarTimer, 1000);
  }
});
</script>
{% endif %}
